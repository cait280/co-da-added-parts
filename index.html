<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CO-DA Inventory">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0909">
<title>CO-DA Inventory</title>
<!-- Gotham is licensed and cannot be embedded, so headings use Montserrat -- the standard Gotham
     stand-in -- with co-da.com's own uppercase + tracking, and body copy uses Open Sans as the
     site does. One request, display=swap, and a system-ui fallback below so the page still reads
     at full speed on a warehouse connection or offline from the home screen. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Open+Sans:wght@400;600&display=swap">
<style>
/* ── CO-DA, read off co-da.com: near-black, white, greys, ONE accent in copper. No gradients,
   one soft shadow, 1px hairlines, a lot of air. Light only for v1. ───────────────────────── */
:root{
  --ink:#0A0909;            /* the dark band, and every black pill */
  --paper:#F7F7F7;          /* page */
  --card:#FFFFFF;
  --line:#E5E5E5;           /* hairline on light */
  --line-dark:rgba(255,255,255,.2);
  --text:#0A0909;
  --body:#6D6D6D;           /* body copy, as the site sets it */
  --mute:#989898;
  --soft:#CCCCCC;           /* placeholders, the lightest grey the site uses */
  --copper:#9B5F42;         /* the one accent, used sparingly */
  --bad:#A3342B;
  --ok:#39C07C;             /* the scan frame stays green: that is function, not decoration */
  --head:'Montserrat',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --sans:'Open Sans',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;background:var(--paper);
  color:var(--text);font:400 16px/1.5 var(--sans);letter-spacing:.28px;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
/* The band bleeds to the edges and under the status bar, so the home-screen clip reads dark;
   the side insets are applied to the content instead of the body. */
header{position:sticky;top:0;z-index:5;background:var(--ink);
  padding:calc(27px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 14px
          calc(16px + env(safe-area-inset-left));
  border-bottom:1px solid var(--line-dark);display:flex;align-items:center;gap:8px 14px;
  flex-wrap:wrap}
/* The wordmark's ALT text is the fallback: if the PNG does not load, Safari renders "CO-DA" in
   this element's own font, which is the tracked Montserrat the brief asks for -- no script. */
.wordmark{height:22px;width:auto;flex:none;
  font:600 17px/22px var(--head);text-transform:uppercase;letter-spacing:.18em;color:#fff}
/* Right of the wordmark when it fits, on its own line beneath when it does not, and WRAPPING
   within that line when the line itself is not enough -- "INVENTORY - ADDED PARTS - ANDREW
   CATRON" at this tracking is wider than a 390px screen, so it needs all three. nowrap was wrong
   here: it stopped the wrap and the title clipped at the right edge instead ("ANDREW CATRO").
   Nothing is ever truncated and there is no ellipsis; the natural break lands at one of the
   " - " separators, so the operator's name falls onto its own line. min-width:0 is what lets a
   flex item wrap below the width of its own content at all. */
h1{margin:0 0 0 auto;min-width:0;font:500 11px/1.4 var(--head);text-transform:uppercase;
  letter-spacing:.2em;color:#fff;text-align:right;white-space:normal}
/* One segment of the band. Unbreakable, so a wrap can only ever happen at a separator -- which
   is what puts the operator's name on its own line instead of splitting it in half. */
.seg{white-space:nowrap}
/* ...and if a single segment is wider than the line on its own, it breaks rather than clips. */
.seg{overflow-wrap:break-word}
main{padding:22px calc(16px + env(safe-area-inset-right))
     calc(120px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  max-width:620px;margin:0 auto}
.screen{display:none}.screen.on{display:block}
/* ── cards ── */
.card,li,.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.06)}
.card{padding:20px 16px}
.msg{margin:14px 0;padding:14px 16px;font-size:15px;color:var(--text);box-shadow:none}
/* An error keeps a red hairline so it reads as one at arm's length; everything else that needs
   attention uses the one accent rather than a second colour. */
.msg.bad{border-left:2px solid var(--bad);color:var(--bad)}
.msg.warn{border-left:2px solid var(--copper)}
/* The handoff line is the one thing still to be done, so it carries the accent. */
#todo-msg .msg{border-left:2px solid var(--copper)}
/* ── type ── */
label{display:block;font:500 11px/1.4 var(--head);text-transform:uppercase;letter-spacing:.22em;
  color:var(--body);margin:0 0 10px}
input{width:100%;padding:15px 16px;font:400 17px/1.3 var(--sans);background:var(--card);
  color:var(--text);border:1px solid var(--line);border-radius:12px}
#pin{text-align:center;letter-spacing:.5em;font-size:22px}
::placeholder{color:var(--soft)}
/* ── buttons: pills. Black on light, ghost is a 1px outline, disabled only loses opacity. ── */
button{font:600 13px/1 var(--head);text-transform:uppercase;letter-spacing:.18em;border:1px solid var(--ink);
  border-radius:999px;padding:18px;background:var(--ink);color:#fff;width:100%;margin-top:14px;
  min-height:52px}
button[disabled]{opacity:.35}
button.ghost{background:transparent;color:var(--ink)}
/* The kind selector: two pills side by side, the selected one black and the other a ghost, so
   the choice reads the same way as every other pair of buttons in the portal (§9). */
.seg{display:flex;gap:10px}
.seg button{margin-top:10px;padding:16px 10px;letter-spacing:.12em}
/* Destructive, but never a red block: a ghost pill in the accent. */
button.danger{background:transparent;color:var(--copper);border-color:rgba(155,95,66,.45)}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
input:focus{outline:2px solid var(--copper);outline-offset:-1px}
/* ── the viewfinder: a dark panel, the caption on a strip across the foot of it ── */
.viewfinder{position:relative;border-radius:16px;background:var(--ink);overflow:visible}
#view{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover;display:block}
/* box-shadow, not a border: a border would reflow the whole list every time a label enters frame */
#view.seen{box-shadow:0 0 0 3px var(--ok)}
.sight{position:absolute;left:0;right:0;bottom:0;margin:0;padding:12px 14px;
  font:500 12px/1.3 var(--head);text-transform:uppercase;letter-spacing:.2em;text-align:center;
  color:#fff;background:rgba(10,9,9,.72);border-radius:0 0 16px 16px;
  -webkit-backdrop-filter:saturate(140%) blur(2px);backdrop-filter:saturate(140%) blur(2px)}
.sight:empty{display:none}
#capture{font-size:14px;padding:19px}
.hint{color:var(--body);font-size:13px;text-align:center;margin:12px 0 0}
.diag{color:var(--mute);font-size:13px;margin:8px 0 0;word-break:break-word}
/* ── rows ── */
ul{list-style:none;margin:18px 0 0;padding:0}
li{padding:14px 16px;margin-bottom:12px}
.name{font:500 15px/1.35 var(--head);letter-spacing:.01em;color:var(--text)}
.desc{color:var(--body);font-size:13px;margin-top:3px}
.meta{color:var(--body);font-size:13px;margin-top:8px}
.flag{color:var(--copper);font-size:13px;margin-top:8px}
.unk{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:10px;margin-top:14px}
/* 44px round ghost controls: the tap target IS the circle, which is what a glove needs. */
.qty button{width:44px;height:44px;min-height:44px;flex:none;margin:0;padding:0;font-size:19px;
  letter-spacing:0;background:transparent;border:1px solid var(--line);color:var(--text);
  border-radius:50%}
.qty input{width:74px;text-align:center;padding:11px;font-size:16px}
.qty .rm{margin-left:auto;color:var(--copper);border-color:rgba(155,95,66,.35)}
/* ── the on-page header: what THIS screen is, under the band that says where you are ──
   Title case, not the band's uppercase: these carry a client name ("Scan - P-3268, [DEV USE
   ONLY] Museum") and tracked caps make a client harder to read at arm's length, which is the
   one thing on the screen the operator has to check. The band directly above it is doing the
   brand's caps-and-tracking work. */
.hdr2{margin:0 0 16px;font:500 19px/1.3 var(--head);letter-spacing:.01em;color:var(--text)}
.hdr2:empty{display:none}
.hi{margin:-8px 0 18px;font:400 15px/1.4 var(--sans);color:var(--body)}
.hi:empty{display:none}
/* a form's own heading inside a card ("Set a PIN for Mounir Wissa") */
.formhdr{margin:0 0 14px;font:500 15px/1.35 var(--head);letter-spacing:.01em;color:var(--text)}
/* the two per-user controls sit side by side and stay a 44px target */
#admin-users .row2 button{margin-top:12px;padding:13px 8px;font-size:11px;letter-spacing:.12em}
/* The search results are tool cards: one full-width button per person, which already greys its
   name and handle together when disabled -- which is exactly what an already-added row is. */
#admin-find-results li{padding:0;overflow:hidden}
#admin-find-results{margin:12px 0 0}
/* The fallback is a link in a sentence, not a pill. */
button.linky{display:inline;margin:0;padding:0;border:0;background:none;color:var(--body);
  font:inherit;text-transform:none;letter-spacing:normal;text-decoration:underline;min-height:0}
#admin-chosen{display:flex;align-items:center;gap:12px;margin-top:12px}
#admin-chosen .name{flex:1;min-width:0}
/* ── Home: one card per tool, the whole card is the tap target ── */
#tools li{padding:0;overflow:hidden}
button.tool{display:block;width:100%;margin:0;padding:20px 18px;text-align:left;
  background:var(--card);color:var(--text);border:0;border-radius:14px;min-height:88px;
  text-transform:none;letter-spacing:normal;font:inherit}
button.tool .name{display:block;font:500 17px/1.3 var(--head);text-transform:uppercase;
  letter-spacing:.14em}
button.tool .desc{display:block;color:var(--body);font:400 13px/1.5 var(--sans);margin-top:6px}
/* The one accent again: a tool that is listed but not built yet says so in copper rather than
   looking like a card that failed to load. */
button.tool .soon{display:inline-block;margin-top:12px;font:600 10px/1 var(--head);
  text-transform:uppercase;letter-spacing:.2em;color:var(--copper);
  border:1px solid rgba(155,95,66,.45);border-radius:999px;padding:6px 10px}
button.tool[disabled]{opacity:1}
button.tool[disabled] .name,button.tool[disabled] .desc{opacity:.45}
.totals{color:var(--mute);margin-top:16px;font-size:12px;letter-spacing:.06em}
.row2{display:flex;gap:10px}.row2 button{flex:1}
</style>
</head>
<body>
<header>
  <img class="wordmark" src="https://co-da.com/wp-content/uploads/2020/10/CO-DA-main_wht.png" alt="CO-DA" width="130" height="22">
  <h1 id="hdr">Inventory</h1>
</header>
<main>

  <section id="s-pin" class="screen on">
    <h2 class="hdr2">CO-DA Inventory</h2>
    <div class="card">
      <label for="pin">Enter your PIN</label>
      <input id="pin" type="tel" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••">
      <button id="pin-go">Continue</button>
    </div>
    <div id="pin-msg"></div>
  </section>

  <!-- The portal's front door. The cards are rendered from the TOOLS array in the script, so a
       third tool is one entry there and nothing here. -->
  <section id="s-home" class="screen">
    <h2 class="hdr2">Home</h2>
    <p class="hi" id="home-hi"></p>
    <ul id="tools"></ul>
    <div id="home-msg"></div>
  </section>

  <section id="s-project" class="screen">
    <h2 class="hdr2">Which project or ticket?</h2>
    <div class="card">
      <label id="kind-hdr">Project or ticket</label>
      <div class="seg">
        <button id="kind-ticket" class="ghost">Service ticket</button>
        <button id="kind-project">Installation project</button>
      </div>
      <label for="proj" id="proj-label">Project number</label>
      <input id="proj" type="text" autocomplete="off" placeholder="Project number">
      <button id="proj-go">Continue</button>
    </div>
    <div id="proj-msg"></div>
    <button id="proj-home" class="ghost">Home</button>
  </section>

  <section id="s-scan" class="screen">
    <h2 class="hdr2" id="scan-hdr"></h2>
    <div class="viewfinder">
      <video id="view" playsinline muted autoplay></video>
      <p class="sight" id="sight"></p>
    </div>
    <button id="capture" disabled>Capture</button>
    <p class="hint" id="scan-hint">Point the camera at a label.</p>
    <div id="scan-msg"></div>
    <ul id="lines"></ul>
    <p class="totals" id="totals"></p>
    <button id="scan-done" disabled>Scan at least one label</button>
  </section>

  <section id="s-review" class="screen">
    <h2 class="hdr2" id="review-hdr"></h2>
    <div class="msg" id="room-line"></div>
    <div id="review-msg"></div>
    <ul id="review"></ul>
    <button id="confirm">Confirm</button>
    <button id="back" class="ghost">Back</button>
  </section>

  <!-- Admin (§11). Shown only to an admin, and every action on it is re-checked server side. -->
  <section id="s-admin" class="screen">
    <h2 class="hdr2">Admin</h2>
    <div id="admin-msg"></div>
    <ul id="admin-users"></ul>
    <div class="card" id="admin-pin-form" hidden>
      <p class="formhdr" id="admin-pin-who"></p>
      <label for="admin-pin1">New PIN</label>
      <input id="admin-pin1" type="tel" inputmode="numeric" maxlength="6" autocomplete="off">
      <label for="admin-pin2">Confirm PIN</label>
      <input id="admin-pin2" type="tel" inputmode="numeric" maxlength="6" autocomplete="off">
      <p class="hint">4 to 6 digits, numbers only.</p>
      <button id="admin-pin-go">Set PIN</button>
      <button id="admin-pin-cancel" class="ghost">Cancel</button>
    </div>
    <button id="admin-add" class="ghost">Add user</button>
    <div class="card" id="admin-add-form" hidden>
      <label for="admin-name">Full name</label>
      <input id="admin-name" type="text" autocomplete="off" placeholder="e.g. Mounir Wissa">
      <label for="admin-find">Find them in Slack</label>
      <input id="admin-find" type="text" autocomplete="off" placeholder="Type a name…">
      <!-- The picked id. A hidden INPUT rather than only a JS variable, so the one thing the
           submit reads is the one thing the pick writes. -->
      <input id="admin-picked" type="hidden">
      <ul id="admin-find-results"></ul>
      <div id="admin-chosen" hidden></div>
      <p class="hint" id="admin-find-note"></p>
      <!-- One line, so Patch's sentence reads as a sentence: the trouble on the left and the way
           round it as the link on the right. The link's words live HERE and nowhere else -- it is
           also the standing fallback when nothing has gone wrong. -->
      <p class="hint"><span id="admin-find-msg"></span><button id="admin-slack-link"
        class="ghost linky">Enter a Slack ID instead</button></p>
      <div id="admin-slack-row" hidden>
        <label for="admin-slack">Slack ID</label>
        <input id="admin-slack" type="text" autocomplete="off" placeholder="e.g. U2V2C3KQ9">
      </div>
      <button id="admin-add-go">Add user</button>
      <button id="admin-add-cancel" class="ghost">Cancel</button>
    </div>
    <button id="admin-home" class="ghost">Home</button>
  </section>

  <section id="s-result" class="screen">
    <div class="msg" id="progress"></div>
    <ul id="result"></ul>
    <div id="result-msg"></div>
    <div id="todo-msg"></div>
    <button id="again">New batch</button>
    <button id="undo" class="danger">Undo this batch</button>
    <!-- Hidden until the batch reaches a finished state; never on Scan or Review, so a batch in
         flight cannot be abandoned by a stray tap. -->
    <button id="result-home" class="ghost" style="display:none">Home</button>
  </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
'use strict';
// ── Added Parts, iPhone web app. One static file; every call goes to API below. ──────────────
// Three things shape this file. One: Safari on iOS has no BarcodeDetector, so jsQR decodes
// frames itself and the camera path is the only path, not a fallback. Two: the PHONE fetches the
// label page, because Jetbuilt sends access-control-allow-origin:* and the phone is on a US
// network -- n8n's Frankfurt egress gets an empty 200 from the same URL.
//
// Three, and this is what v2b is: n8n does NOT serve this file any more. n8n cloud stamps
// `content-security-policy: sandbox allow-scripts` on every text/html webhook response, with no
// allow-same-origin, and a Respond to Webhook response header does not override it -- Marshal
// proved that with two probe workflows, and n8n hardened it deliberately after CVE-2025-61914.
// An opaque origin cannot reach getUserMedia and throws on localStorage, which is exactly what
// Andrew's iPhone showed: no camera, and the PIN asked for again on every reload. So the page is
// hosted on a static host of its own and the API below is absolute. Nothing on the n8n side has
// to change for that: its OPTIONS preflight already echoes the Origin back.
var API = 'https://co-da.app.n8n.cloud/webhook/added-parts-mrtjqxp76jy/api';
var LABEL = 'https://jetbui.lt/i/';
var MARKER = 'This asset is being tracked within the Jetbuilt Project Platform';
// The PIN is hashed here, on the phone, before it is sent: n8n's execution data held it in clear
// (13080, 13081, 13086, 13089). This string is PART OF THE STORED CREDENTIAL, not a tuning knob
// -- changing it invalidates every pin_hash in cody_added_parts_users and needs a reseed.
var PIN_SALT = 'co-da.added-parts';

// ── the portal ───────────────────────────────────────────────────────────────────────────────
// §10: the page is an inventory portal and Added Parts is the first tool in it. Every string the
// portal itself owns lives HERE, in one object, because Patch's §7c copy replaces all of it
// verbatim in one edit -- these are placeholders until it lands. The Scan, Review and Result
// headers are NOT in here: those are his final §7b strings and they do not change.
// Patch's §7c, verbatim. Written title case: the band's CSS does the uppercase (§9).
var PORTAL = {
  band: 'Inventory',          // the band is WHERE you are: Inventory [— tool] [— operator]
  segment: 'Added Parts',     // inserted once a tool is open, and taken back out at Home
  hi: 'Hi ',                  // Home's welcome line, first name only, or no line at all
  home: 'Home',               // the ghost button, on Project and a finished Result only
  soon: 'Coming soon',        // a tag on the card, never a button
};
// One entry per tool. A third tool is one more line here and nothing else: the cards, the tap
// handlers and the disabled state all come off this list. Card copy is Patch's.
var TOOLS = [
  { id: 'added-parts', name: 'Added Parts', ready: true,
    desc: 'Scan parts and add them to a project or a ticket.' },
  { id: 'return-to-stock', name: 'Return to Stock', ready: false,
    desc: 'Scan a part coming back from a job, put it back on the shelf, and take it off the '
      + 'project.' },
  // Shown only to an admin. Hiding it is convenience: every admin action is re-checked against
  // the caller's users row server side, so an operator who reaches one anyway is refused there.
  { id: 'admin', name: 'Admin', ready: true, admin: true,
    desc: "Set PIN codes and turn anyone's access on or off." },
];

var state = { token: null, name: null, role: '', project: null, lines: [], batch: null,
  room: null, undoUntil: 0, busy: false, kind: 'project' };

var $ = function (id) { return document.getElementById(id); };
var show = function (id) {
  var all = document.querySelectorAll('.screen');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('on');
  $(id).classList.add('on');
};
var say = function (where, text, kind) {
  $(where).innerHTML = text ? '<div class="msg ' + (kind || '') + '"></div>' : '';
  if (text) $(where).firstChild.textContent = text;
};
var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
// The one place that writes the header band. It is composed, not a table of strings: the portal
// name, the tool segment if a tool is open, and the operator once the PIN has succeeded. Four of
// the six screens share one value because the band does not re-state screen-level detail (§7c).
var band = function (segment) {
  var parts = [PORTAL.band, segment || '', state.name || ''].filter(Boolean);
  var el = $('hdr');
  // textContent FIRST, so the element's text is the plain composed string and anything reading it
  // -- a test, a screenshot tool, a screen reader -- sees exactly what Patch wrote.
  el.textContent = parts.join(' — ');
  // Then the same string again as one nowrap span per segment, separated by a real space. The
  // band is too wide for a phone once a tool and a full name are both in it, and left to wrap
  // on its own the break landed inside the NAME ("ANDREW / CATRON"). The only break
  // opportunities now are the spaces BETWEEN segments, so a segment is never split and the
  // operator's name drops whole onto its own line. In a browser this leaves textContent
  // identical to the line above; nothing is added, removed or reordered.
  if (parts.length > 1) {
    el.innerHTML = parts.map(function (part, i) {
      return '<span class="seg">' + esc(part) + (i < parts.length - 1 ? ' —' : '') + '</span>';
    }).join(' ');
  }
};

// ── Home ─────────────────────────────────────────────────────────────────────────────────────
// "Hi Andrew." First name only, and ONLY when the users table resolved one -- no generic
// "Welcome" filler for a session that cannot say who it belongs to (Patch).
function home() {
  var first = String(state.name || '').trim().split(/\s+/)[0] || '';
  $('home-hi').textContent = first ? PORTAL.hi + first + '.' : '';
}
function renderTools() {
  var shown = TOOLS.filter(function (t) { return !t.admin || state.role === 'admin'; });
  $('tools').innerHTML = shown.map(function (t) {
    return '<li><button class="tool" id="tool-' + t.id + '"' + (t.ready ? '' : ' disabled') + '>'
      + '<span class="name">' + esc(t.name) + '</span>'
      + '<span class="desc">' + esc(t.desc) + '</span>'
      + (t.ready ? '' : '<span class="soon">' + esc(PORTAL.soon) + '</span>')
      + '</button></li>';
  }).join('');
  // A tool that is not ready gets NO handler at all, not a handler that refuses: there is nothing
  // behind Return to Stock yet and a tap that appears to do something is worse than one that does
  // not respond.
  shown.forEach(function (t) {
    if (!t.ready) return;
    $('tool-' + t.id).onclick = function () { openTool(t.id); };
  });
}
function openTool(id) {
  if (id === 'admin') return openAdmin();
  if (id !== 'added-parts') return;
  // A fresh start every time, so a tool entered twice never shows the last run's list.
  state.project = null;
  state.lines = [];
  state.batch = null;
  $('proj').value = '';
  // The kind selector is NOT reset: it keeps what the tech chose last, which is the point of
  // remembering it. Only the number and the message go.
  say('proj-msg', '');
  band(PORTAL.segment);
  show('s-project');
}
// ── the admin tool ───────────────────────────────────────────────────────────────────────────
// Every action here is an `admin.<op>` API call, and the SERVER decides: this screen existing at
// all is convenience. An operator who reaches one of these calls is refused there, the attempt is

function runFind(q) {

  // deleted back below two letters, which must leave NO list on the screen. clearTimeout covers

// ── sha256 ───────────────────────────────────────────────────────────────────────────────────
// Byte-identical to tools/build/app/ap/_sha.js, which is what AP Login hashes with; the suite
// fails if the two copies drift. Hand-rolled rather than crypto.subtle because that is async and
// gated on a secure context, and because one implementation shared with the server is the whole
// point -- two that disagree lock the operator out of a system with one operator.
/* _sha.js begin */
// sha256, written out rather than required: the Code sandbox has no crypto to assume, and this
// hashes PINs. Lifted verbatim from the scheduling sync (SS Derive), where it has run daily since
// September.
function sha256(ascii) {
  function rr(n, x) { return (n >>> x) | (n << (32 - x)); }
  const K = [];
  const H = [1779033703, 3144134277, 1013904242, 2773480762, 1359893119, 2600822924, 528734635, 1541459225];
  let p = 2, i, j;
  for (i = 0; i < 64;) {
    let isPrime = true;
    for (let f = 2; f * f <= p; f++) if (p % f === 0) { isPrime = false; break; }
    if (isPrime) { K[i] = (Math.pow(p, 1 / 3) % 1 * Math.pow(2, 32)) | 0; i++; }
    p++;
  }
  const msg = unescape(encodeURIComponent(ascii));
  const words = [];
  const len = msg.length * 8;
  for (i = 0; i < msg.length; i++) words[i >> 2] |= msg.charCodeAt(i) << ((3 - i % 4) * 8);
  words[len >> 5] |= 0x80 << (24 - len % 32);
  words[((len + 64 >> 9) << 4) + 15] = len;
  const w = new Array(64);
  for (i = 0; i < words.length; i += 16) {
    const h = H.slice();
    for (j = 0; j < 64; j++) {
      if (j < 16) w[j] = words[i + j] | 0;
      else {
        const g0 = w[j - 15], g1 = w[j - 2];
        const s0 = rr(g0, 7) ^ rr(g0, 18) ^ (g0 >>> 3);
        const s1 = rr(g1, 17) ^ rr(g1, 19) ^ (g1 >>> 10);
        w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
      }
      const S1 = rr(h[4], 6) ^ rr(h[4], 11) ^ rr(h[4], 25);
      const ch = (h[4] & h[5]) ^ (~h[4] & h[6]);
      const t1 = (h[7] + S1 + ch + K[j] + w[j]) | 0;
      const S0 = rr(h[0], 2) ^ rr(h[0], 13) ^ rr(h[0], 22);
      const mj = (h[0] & h[1]) ^ (h[0] & h[2]) ^ (h[1] & h[2]);
      const t2 = (S0 + mj) | 0;
      h[7] = h[6]; h[6] = h[5]; h[5] = h[4]; h[4] = (h[3] + t1) | 0;
      h[3] = h[2]; h[2] = h[1]; h[1] = h[0]; h[0] = (t1 + t2) | 0;
    }
    for (j = 0; j < 8; j++) H[j] = (H[j] + h[j]) | 0;
  }
  return H.map((x) => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
}
/* _sha.js end */

// ── the one call ──
function api(action, body) {
  var payload = body || {};
  payload.action = action;
  payload.token = state.token;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload) })
    .then(function (r) { return r.json().catch(function () { return { error: 'unreadable' }; }); })
    .then(function (j) {
      // A token that has expired drops the operator back to the PIN rather than failing oddly
      // somewhere deeper in.
      if (j && j.error === 'auth') { signOut(); throw new Error('auth'); }
      return j;
    });
}
function signOut() {
  state.token = null; state.name = null; state.role = '';
  band();
  show('s-pin');
}

// ── one tap is one request ───────────────────────────────────────────────────────────────────
// Every tap in Arc fired the handler twice: two logins (13080/13081) and two project lookups
// (13083/13084) from one tap each. A duplicate login is not merely noise -- each login mints a
// NEW token and upserts it, so the row ends up holding one token while the page holds the other,
// and the next call comes back {error:"auth"} and drops the operator to the PIN screen. The
// button's own disabled flag is the guard: a second tap before the first answer does nothing,
// and `free` puts the button back on every path, including the ones that return early.
function once(id, run) {
  var el = $(id);
  el.onclick = function () {
    if (el.disabled) return;
    el.disabled = true;
    var free = function () { el.disabled = false; };
    try { run(free); } catch (e) { free(); throw e; }
  };
}

// ── 1. PIN ──
once('pin-go', function (free) {
  var pin = $('pin').value.trim();
  if (!/^\d{4,6}$/.test(pin)) {
    say('pin-msg', "That PIN isn't recognized. Try again.", 'bad'); free(); return;
  }
  say('pin-msg', '');
  // The PIN itself never leaves the phone; the shape check above is the only place that sees it.
  api('login', { pin_h1: sha256(PIN_SALT + ':' + pin) }).then(function (r) {
    free();
    if (r.locked) { say('pin-msg', 'Too many tries — locked for 10 minutes. Try again after that.', 'bad'); return; }
    if (!r.ok) { say('pin-msg', "That PIN isn't recognized. Try again.", 'bad'); $('pin').value = ''; return; }
    state.token = r.token; state.name = r.name; state.role = r.role || 'operator';
    $('pin').value = '';
    // The Admin card exists only for an admin, so the list is rebuilt once the role is known.
    renderTools();
    // The portal's front door, not a tool: a PIN opens every tool in it (§10), so the operator
    // chooses from Home rather than being dropped into Added Parts.
    band();
    home();
    show('s-home');
  }).catch(function () { free(); say('pin-msg', "I couldn't reach the system. Try again.", 'bad'); });

// ── 2. Project or ticket ──
// The service department works off tickets, and a ticket's parts all land on one Jetbuilt project
// (P-3324) in a room named after the ticket's client. Which kind this is comes from the SELECTOR
// the tech sets before typing (§7b.1, v2j): a bare number is no longer ambiguous because nobody
// has to guess at it, and the request always says which kind it is.
// EXPLICIT shapes only (§7b.1, v2j, with Patch's correction). "3713-9256" / "ticket 9256" /
// "T9256" / "#9256" say ticket and "P-3161" says project; anything else -- above all a bare
// number, whatever its length -- returns '' and leaves the selector alone, because a bare number
// is the exact case the selector exists for. v2f guessed here and asked the operator when it
// could not; both are gone.

  var t = String(text || '').trim();

}

// is wrapped -- the page still works, it just forgets (§2b).

  $('kind-project').className = t ? 'ghost' : '';
  var word = t ? 'Ticket number' : 'Project number';
  $('proj-label').textContent = word;
  $('proj').placeholder = word;

  try { return localStorage.getItem(KIND_KEY) === 'ticket' ? 'ticket' : 'project'; }
  catch (e) { return 'project'; }
}

  var p = state.project || {};
  return p.label || (p.number ? 'P-' + p.number : 'this batch');
}
function lookUp(kind) {
  return function (free) {
    var num = $('proj').value.trim();
    if (!num) { free(); return; }
    say('proj-msg', '');
    api('project', { number: num, kind: kind }).then(function (r) {
      free();
      if (r.notFound) {
        say('proj-msg', kind === 'ticket'
          ? "I can't find that ticket. Check the number and try again."
          : "I can't find that project. Check the number and try again.", 'bad');
        return;
      }
      if (r.noClient) {
        // The room IS the client name for a ticket batch, so a ticket nothing resolves a name for
        // is refused rather than filed somewhere nobody looks.
        say('proj-msg', 'I found ticket #' + r.number
          + ", but I can't tell whose job it is. Check with dispatch, then try again.", 'bad');
        return;
      }
      if (r.locked) {
        // P-3324 being locked blocks EVERY ticket, not just this one, so it reads differently
        // from an ordinary project whose current version a PM has closed.
        say('proj-msg', kind === 'ticket'
          ? 'Ticket parts are locked right now. Check with your supervisor before scanning any tickets.'
          : 'P-' + r.number + "'s current version is locked. Check with PM before scanning.", 'bad');
        return;
      }
      state.project = r;
      state.lines = [];
      render();
      // §7c splits these two apart: the BAND says where you are in the portal and is the same on
      // all four Added Parts screens, while the on-page header says what THIS screen is. Before
      // the portal the band carried both and Review never got a header of its own at all.
      // plabel() rather than r.label: one place decides how a batch is named, and an older
      // reply that carries only the number still reads as "P-3268" instead of "undefined".
      band(PORTAL.segment);
      $('scan-hdr').textContent = 'Scan — ' + plabel() + ', ' + r.client;
      show('s-scan');

var goProject = lookUp('project');
var goTicket = lookUp('ticket');
// Tapping a pill is the tech's own choice, so it is remembered. Typing an explicit shape moves
// the control for this lookup but is NOT remembered -- the pills say what the next batch starts
// as, and one pasted "3713-9256" should not change that.
$('kind-ticket').onclick = function () { setKind('ticket', true); };
$('kind-project').onclick = function () { setKind('project', true); };
$('proj').oninput = function () {

// ── 3. Scan ──
// PRESS TO CAPTURE (v2c). The first field run auto-added every code the camera decoded and then
// kept bumping the quantity while the label sat in view, so one label became several units. The
// decoder still runs continuously, but it only ever SIGHTS a code: the viewfinder goes green, the
// caption names the product once the lookup answers, and Capture arms. Nothing reaches the list
// until Capture is tapped, and one tap is exactly one unit. There is no debounce timer anywhere
// in the add path any more -- the gate is the tap, and `sighting.captured` is what closes it
// until the label leaves the frame or a different one appears.
var stream = null, raf = 0;
// What is in frame right now, and whether it has already been taken.
var sighting = null;
// code -> what the lookup said, so a second capture of the same label needs no second lookup and
// a row captured before the answer arrives still gets filled in.
var known = {}, looking = {};
// jsQR misses single frames constantly (motion blur, focus hunting). Clearing the sighting on the
// first miss would strobe the green frame and disarm the button under the operator's thumb, so a
// short run of misses is what counts as "the label left". This paces the VIEWFINDER only; it can
// never add anything, which is what the old 1.5 s debounce was doing.
var misses = 0, MISS_FRAMES = 8;
function startCamera() {
  if (stream) return;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function (s) {
      stream = s;
      var v = $('view');
      v.srcObject = s;
      return v.play();
    })
    .then(function () { raf = requestAnimationFrame(tick); })
    .catch(function (e) {
      // The error NAME is the whole diagnosis and a screenshot from the field is all we get:
      // NotAllowedError is a permission refused or not even askable (an opaque origin cannot
      // prompt, which is what the n8n-served page did), NotFoundError is no camera at all,
      // NotReadableError is another app holding it. The origin is printed alongside when the page
      // is not in a proper secure context, because that IS the opaque-origin failure.
      say('scan-msg', "I can't get to the camera. Allow camera access for this page, then reload.", 'bad');
      var why = e && e.name ? e.name : 'unknown error';
      if (!window.isSecureContext || location.origin === 'null') why += ' \u00b7 origin ' + location.origin;
      var p = document.createElement('p');
      p.className = 'diag';
      p.textContent = why;
      $('scan-msg').firstChild.appendChild(p);
    });
}
function stopCamera() {
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
}
var canvas = document.createElement('canvas');
function tick() {
  var v = $('view');
  if (v.readyState === v.HAVE_ENOUGH_DATA && typeof jsQR === 'function') {
    canvas.width = v.videoWidth; canvas.height = v.videoHeight;
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
    var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var hit = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    var code = hit && hit.data ? codeFrom(String(hit.data).trim()) : null;
    if (code) { misses = 0; onSight(code); }
    else if (sighting && ++misses > MISS_FRAMES) onLost();
  }
  raf = requestAnimationFrame(tick);
}
// Exported for the suite: the code out of a scanned URL, or null if it is not one of ours.
function codeFrom(text) {
  // Case-insensitive on the PREFIX only: a QR encodes whatever was printed on the label, and a
  // single uppercase run would otherwise make every scan read as unrecognised. The code itself
  // keeps its case, because it is case-sensitive to Jetbuilt.
  var t = String(text);
  var i = t.toLowerCase().indexOf(LABEL);
  if (i === -1) return null;
  var m = t.slice(i + LABEL.length).match(/^([A-Za-z0-9_-]+)/);
  return m ? m[1] : null;
}
// Exported for the suite: the product name and description out of the label page.
function parseLabel(html) {
  var text = String(html)
    .replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ')
    .replace(/<[^>]+>/g, '\n').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');
  var lines = text.split('\n').map(function (l) { return l.replace(/\s+/g, ' ').trim(); })
    .filter(function (l) { return l.length; });
  var at = -1;
  for (var i = 0; i < lines.length; i++) if (lines[i].indexOf(MARKER) !== -1) { at = i; break; }
  if (at === -1) return null;
  var rest = lines.slice(at + 1).filter(function (l) { return l.indexOf(MARKER) === -1; });
  if (!rest.length) return null;
  return { name: rest[0], desc: rest[1] && !/^Installation Date|^For service/i.test(rest[1]) ? rest[1] : '' };
}
function buzz() { try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {} }

// A code has come into frame (or a different one has replaced it).
function onSight(code) {
  if (sighting && sighting.code === code) return;      // the same label, still being held up
  sighting = { code: code, captured: false };
  paintSight();
  // Fired on SIGHT so the name is on screen by the time the thumb arrives. It creates no row.
  look(code);
}
function onLost() {
  sighting = null;
  misses = 0;
  paintSight();
}
function paintSight() {
  var cap = $('capture');
  $('view').classList[sighting ? 'add' : 'remove']('seen');
  if (!sighting) { $('sight').textContent = ''; cap.disabled = true; return; }
  var k = known[sighting.code];
  cap.disabled = sighting.captured;
  $('sight').textContent = sighting.captured ? 'Captured. Move to the next label.'
    : k ? (k.unknown ? "I don't recognize this one." : k.name)
    : 'Label found';
}
// One tap, one unit. The guard is `captured`, not a timer, so a held label and a long press both
// do nothing until the label leaves the frame or another one takes its place.
$('capture').onclick = function () {
  if (!sighting || sighting.captured) return;
  var code = sighting.code;
  sighting.captured = true;
  buzz();
  $('scan-hint').style.display = 'none';
  var row = findRow(code);
  if (row) row.qty += 1;
  else {
    row = { code: code, qty: 1, name: 'Reading…', desc: '', pending: true };
    if (known[code]) applyKnown(row, known[code]);
    state.lines.push(row);
  }
  render();
  paintSight();
  look(code);                                           // a no-op if it is already known
};
// The PHONE reads the label page. If it cannot, the server may still know the code from cache.
function look(code) {
  if (known[code] || looking[code]) return;
  looking[code] = true;
  fetch(LABEL + code, { mode: 'cors', credentials: 'omit' })
    .then(function (r) { return r.text(); })
    .then(function (html) { return parseLabel(html); })
    .catch(function () { return null; })
    .then(function (label) {
      return api('resolve', { code: code, label_name: label ? label.name : '', label_desc: label ? label.desc : '' })
        .then(function (r) { learn(code, knownFrom(r, Boolean(label))); });
    })
    .catch(function () { learn(code, knownFrom(null, true)); });
}
function knownFrom(r, labelRead) {
  return (r && r.company_product_id)
    ? { company_product_id: r.company_product_id, name: r.product_name,
        desc: r.short_description || '' }
    : { unknown: true, labelFailed: !labelRead };
}
function learn(code, k) {
  looking[code] = false;
  known[code] = k;
  var row = findRow(code);
  if (row) { applyKnown(row, k); render(); }
  if (sighting && sighting.code === code) paintSight();
}
function applyKnown(row, k) {
  row.pending = false;
  if (k.unknown) {
    row.unknown = true;
    row.labelFailed = Boolean(k.labelFailed);
    row.company_product_id = undefined;
    row.name = k.labelFailed ? "Couldn't read that label — try scanning it again, or enter it below."
      : "I don't recognize this one.";
    row.desc = '';
  } else {
    row.unknown = false;
    row.company_product_id = k.company_product_id;
    row.name = k.name;
    row.desc = k.desc;
  }
}
function findRow(code) {
  for (var i = 0; i < state.lines.length; i++) if (state.lines[i].code === code) return state.lines[i];
  return null;
}

function render() {
  var ul = $('lines');
  ul.innerHTML = '';
  var units = 0;
  state.lines.forEach(function (row, idx) {
    units += row.qty;
    var li = document.createElement('li');
    var html = '<div class="name">' + esc(row.name) + '</div>';
    if (row.desc) html += '<div class="desc">' + esc(row.desc) + '</div>';
    if (row.unknown) {
      html += '<div class="unk">'
        + '<label>Manufacturer</label><input class="mf" autocomplete="off">'
        + '<label>Model</label><input class="md" autocomplete="off">'
        + '<button class="use">Use this</button></div>';
    }
    html += '<div class="qty">'
      + '<button class="minus" aria-label="one fewer">−</button>'
      + '<input class="n" type="tel" inputmode="numeric" value="' + row.qty + '">'
      + '<button class="plus" aria-label="one more">+</button>'
      + '<button class="rm" aria-label="remove">✕</button></div>';
    li.innerHTML = html;
    li.querySelector('.minus').onclick = function () { row.qty = Math.max(1, row.qty - 1); render(); };
    li.querySelector('.plus').onclick = function () { row.qty += 1; render(); };
    li.querySelector('.n').onchange = function (e) {
      var n = parseInt(e.target.value, 10);
      row.qty = n > 0 ? n : 1;
      render();
    };
    li.querySelector('.rm').onclick = function () { state.lines.splice(idx, 1); render(); };
    if (row.unknown) {
      li.querySelector('.use').onclick = function () {
        var mf = li.querySelector('.mf').value.trim(), md = li.querySelector('.md').value.trim();
        if (!mf || !md) return;
        row.name = 'Looking up…'; row.unknown = false; row.pending = true; render();
        api('resolve', { code: row.code, label_name: mf + ' ' + md })
          .then(function (r) { learn(row.code, knownFrom(r, true)); })
          .catch(function () { learn(row.code, knownFrom(null, true)); });
      };
    }
    ul.appendChild(li);
  });
  var usable = state.lines.filter(function (r) { return r.company_product_id; });
  $('totals').textContent = state.lines.length
    ? state.lines.length + (state.lines.length === 1 ? ' line, ' : ' lines, ') + units + (units === 1 ? ' unit' : ' units')
    : '';
  var go = $('scan-done');
  go.disabled = !usable.length;
  go.textContent = usable.length ? 'Done scanning' : 'Scan at least one label';
}

// ── 4. Review ──
// One body for tally and for confirm. The server recomputes the tally at confirm time from
// exactly this input, so there is one shape and one place to change it.
//
// The project LABEL travels with it because the confirm execution has no project lookup of its
// own -- every action is its own webhook call -- and without it the inventory channel read
// "Added parts — P-, , scanned by Andrew" (exec 13140). It is display only: project_id is what
// every URL and every match in the write path is keyed on, and number/client/name come from the
// same project reply that project_id came from, so they are no more trusted than it is.
function batchBody() {
  var p = state.project || {};
  return {
    project_id: p.project_id,
    // v2f: `kind` decides a dated room or the client's own room, "P-3268" or "Ticket #9256" in
    // every line anyone reads, and the Project Type on the board. `parts_label` is where the lines
    // actually sit in Jetbuilt -- P-3324 for every ticket -- which is what Mounir is asked to
    // allocate and assign against. All of it came from the same project reply project_id came
    // from, and all of it is display only.
    project_kind: p.kind,
    // §7b.10: a ticket batch's note goes onto this conversation. The page is the only thing that
    // has it at confirm time -- the lookup that found it ran in a different execution -- so it
    // travels with the label and the client, display-only values the write path never keys on.
    pv_conversation_id: p.pv_conversation_id || '',
    project_label: p.label,
    project_parts_label: p.parts_label,
    project_location: p.location,
    project_number: p.number,
    project_client: p.client,
    project_name: p.name,
    lines: state.lines.filter(function (r) { return r.company_product_id; })
      .map(function (r) { return { code: r.code, qty: r.qty, company_product_id: r.company_product_id }; }),
  };
}
$('scan-done').onclick = function () {
  var body = batchBody();
  if (!body.lines.length) return;
  stopCamera();
  $('review-hdr').textContent = 'Review — ' + plabel() + ', '
    + String((state.project || {}).client || '');
  say('review-msg', '');
  $('review').innerHTML = '';
  $('room-line').textContent = 'Working it out…';
  // Nothing is confirmable until the tally comes back, so Confirm starts off and is armed only by
  // a reply that actually has lines in it.
  $('confirm').disabled = true;
  show('s-review');
  api('tally', body).then(function (r) {
    // The server's own message says WHICH thing is wrong ("I can't find the Staging On-Jobsite
    // location in Jetbuilt"); mine said only that something was. Pass it through, and keep the
    // generic line for the cases where there is nothing to pass on.
    if (r && r.error) return tallyFailed(r.error);
    if (!r || !r.lines) return tallyFailed(null);
    $('confirm').disabled = false;
    state.room = r.room;
    // A ticket batch's room is the client's name, so the project it is going into has to be said
    // out loud: "Going into P-3324, room: Dixon" (Patch).
    $('room-line').textContent = r.room_in
      ? 'Going into ' + r.room_in + ', room: ' + r.room
      : 'Going into room: ' + r.room;
    var ul = $('review');
    ul.innerHTML = '';
    r.lines.forEach(function (l) {
      var li = document.createElement('li');
      var h = '<div class="name">' + esc(l.product_name) + '</div>';
      if (l.short_description) h += '<div class="desc">' + esc(l.short_description) + '</div>';
      h += '<div class="meta">qty ' + l.qty + ' · shelf has ' + l.on_hand
        + '</div>';
      h += '<div class="meta">' + esc(l.from_label || 'the shelf') + ' → ' + esc(r.destination) + '</div>';
      if (l.short > 0) {
        h += '<div class="flag">⚠️ stock short by ' + l.short + ' — the project gets all '
          + l.qty + ', the shelf moves ' + l.moved + ', reconcile the rest.</div>';
      }
      li.innerHTML = h;
      ul.appendChild(li);
    });
  }).catch(function () { tallyFailed(null); });
};
function tallyFailed(text) {
  // Confirm is WITHDRAWN, not left armed. Letting it fire after a failed tally is how exec 13109
  // reached a confirm with no destination, which answered nothing useful, posted an empty summary
  // to the inventory channel and left a junk batch row behind.
  state.room = null;
  $('review').innerHTML = '';
  $('room-line').textContent = '';
  $('confirm').disabled = true;
  say('review-msg', text || "I couldn't work that out. Go back and try again.", 'bad');
}
$('back').onclick = function () { onLost(); show('s-scan'); startCamera(); };

// ── 5. Confirm, then poll ──
$('confirm').onclick = function () {
  if (state.busy || $('confirm').disabled) return;
  state.busy = true;
  $('confirm').disabled = true;
  say('review-msg', '');
  api('confirm', batchBody()).then(function (r) {
    if (r && r.error) return failSubmit(r.error);
    if (!r || !r.batch_id) return failSubmit(null);
    state.batch = r.batch_id;
    $('result').innerHTML = '';
    say('result-msg', '');
    $('progress').textContent = 'Adding to ' + plabel() + '…';
    $('undo').style.display = '';
    show('s-result');
    poll();
  }).catch(function () { failSubmit(null); });
};
function failSubmit(text) {
  // Patch: the list is never lost, so this invites a retry rather than a restart. A message FROM
  // the server replaces that line when there is one -- it says what to do about it.
  state.busy = false;
  $('confirm').disabled = false;
  show('s-review');
  say('review-msg', text
    || "Something went wrong adding these — nothing's lost, your list is still here. Try Confirm again.", 'bad');
}
function poll() {
  api('status', { batch_id: state.batch }).then(function (r) {
    if (!r) return setTimeout(poll, 2000);
    if (r.state === 'running' || !r.state) {
      $('progress').textContent = 'Adding to ' + plabel() + '… '
        + (r.done || 0) + ' of ' + (r.total || 0) + ' done.';
      return setTimeout(poll, 2000);
    }
    state.busy = false;
    if (r.state === 'failed') return failSubmit(r.error || null);
    $('progress').textContent = 'Added to room: ' + (r.room || state.room);
    var ul = $('result');
    ul.innerHTML = '';
    (r.lines || []).forEach(function (l) {
      var li = document.createElement('li');
      var h = '<div class="name">' + esc(l.product_name) + ' — ' + l.moved + ' moved</div>'
        + '<div class="meta">' + esc(l.from_label || 'the shelf') + ' → ' + esc(r.destination) + '</div>';
      if (l.short > 0) {
        h += '<div class="flag">⚠️ stock short by ' + l.short + ' — the project gets all '
          + l.qty + ', the shelf moves ' + l.moved + ', reconcile the rest.</div>';
      }
      if (l.error) h += '<div class="flag">' + esc(l.error) + '</div>';
      li.innerHTML = h;
      ul.appendChild(li);
    });
    // Two independent writes, each with its own sentence (§7b.9, §7b.10.3). pv_note_ok is NULL
    // when no ticket note was attempted -- a project batch, or the note still switched off --
    // and null says nothing at all rather than reading as a failure. When both failed, the
    // second sentence drops the "Added to ..." opener so the line does not say it twice.
    var told = [r.slack_ok === false
      ? 'Added to ' + plabel() + ". I couldn't post the summary to the inventory channel — check it yourself if you want this logged there."
      : 'Posted to the inventory channel.'];
    if (r.pv_note_ok === false) {
      told.push((r.slack_ok === false ? 'I also' : 'Added to ' + plabel() + ". I")
        + " couldn't add this to the ticket's notes in ProVision — check it yourself if you want this logged there.");
    }
    say('result-msg', told.join(' '));
    // The batch is NOT finished when the stock has moved: allocate and assign are human steps in
    // Jetbuilt that only Mounir can take. The server composes this line, because which of the
    // three variants applies depends on whether the board row and the DM landed.
    say('todo-msg', r.todo || '', r.todo && /couldn/.test(r.todo) ? 'warn' : '');
    // The batch is finished, so leaving it is safe to offer.
    $('result-home').style.display = '';
    // Patch: the undo button quietly expires, with no message.
    state.undoUntil = Date.now() + 2 * 60 * 60 * 1000;
    setTimeout(function () { $('undo').style.display = 'none'; }, 2 * 60 * 60 * 1000);
  }).catch(function () { setTimeout(poll, 2000); });
}

$('again').onclick = function () {
  state.lines = []; state.batch = null;
  onLost();
  $('undo').style.display = 'none';
  $('result-home').style.display = 'none';
  render();
  show('s-scan');
  startCamera();
};
$('undo').onclick = function () {
  if (!state.batch || Date.now() > state.undoUntil) return;
  if (!confirm('Undo this batch? The items come off ' + plabel()
      + ' and the stock goes back to the shelf.')) return;
  $('undo').disabled = true;
  api('undo', { batch_id: state.batch }).then(function (r) {
    $('undo').disabled = false;
    if (!r || !r.ok) {
      // Once Mounir has allocated and assigned the parts the stock is not where this would put it
      // back, so the undo is refused rather than attempted -- Jetbuilt has to be the one to
      // reverse it from there.
      say('result-msg', r && r.reason === 'assigned'
        ? "This batch is already assigned in Jetbuilt, so I can't undo it. Undo it in Jetbuilt first."
        : r && r.reason === 'undone' ? 'That batch is already undone.'
        : "I couldn't undo that one. Check " + plabel() + ' by hand.', 'bad');
      return;
    }
    $('undo').style.display = 'none';
    $('result-home').style.display = '';
    $('result').innerHTML = '';
    say('todo-msg', '');
    $('progress').textContent = 'Undone — ' + plabel()
      + "'s items from this batch are zeroed out and the stock is back on the shelf.";
    // Jetbuilt silently drops `notes` on an item PATCH (exec 13145), so a zeroed item can still
    // read "Scanned in by ...". Say so rather than let someone find it in Jetbuilt and doubt the
    // undo. The line disappears on its own if Jetbuilt starts honouring the field.
    var saidUndo = [];
    if (r.slack_ok === false) {
      saidUndo.push("Undone. I couldn't post this to the inventory channel — check it yourself "
        + 'if you want this logged there.');
    }
    if (r.pv_note_ok === false) {
      saidUndo.push("Undone. I couldn't add this to the ticket's notes in ProVision — check it "
        + 'yourself if you want this logged there.');
    }
    // Jetbuilt silently drops `notes` on an item PATCH (exec 13145), so a zeroed item can still
    // read "Scanned in by ...". Say so rather than let someone find it in Jetbuilt and doubt the
    // undo. It says nothing about whether the undo worked -- that was v2ia's live defect -- and
    // the line disappears on its own if Jetbuilt starts honouring the field.
    if (r.note_kept) {
      saidUndo.push('Jetbuilt kept the original note on those items, so they still read as '
        + 'scanned in — the quantities are correct.');
    }
    say('result-msg', saidUndo.join(' '));
  }).catch(function () { $('undo').disabled = false; });
};

// ── no remembered device ─────────────────────────────────────────────────────────────────────
// Andrew, §10: "no matter what, the first thing that is displayed when the webpage is loaded is
// the login screen." So there is no auto-login, and nothing to auto-login WITH: the token is not
// written to the device at all any more. It lives in `state` for the session and carries the API
// calls; a reload means a PIN. That also takes a working credential off a phone that may be put
// down in a warehouse, which is the better end of the trade either way.
// The band is composed from one place on every screen, including the first one, so the markup's
// text above is only what shows before the script runs.
band();
renderTools();
setKind(rememberedKind(), false);
// The seam the suite drives: sighting a code and losing it are what tick() does with a decoded
// frame, and faking a canvas + jsQR to reach them would test the fake, not the gate.
window.__ap = { codeFrom: codeFrom, parseLabel: parseLabel, state: state,
  sight: onSight, lost: onLost, known: function () { return known; } };
</script>
</body>
</html>
